<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RA Monitor{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Navbar Minimalista -->
    <header class="navbar-glass sticky-top mb-4">
        <div class="container-xl px-3 d-flex justify-content-between align-items-center" style="max-width: 1100px;">
            <div class="d-flex align-items-center gap-2">
                <div class="brand-icon"><i class="bi bi-ticket-perforated-fill"></i></div>
                <span class="navbar-brand-text fw-bold text-light" style="font-size: 0.95rem; letter-spacing: -0.3px;">RA QA</span>
            </div>
            <div class="user-pill d-flex align-items-center gap-2 px-2 py-1 rounded-pill">
                <span class="status-dot"></span>
                <span class="text-secondary fw-medium" style="font-size: 0.75rem;">{{ ra_user or 'Desconectado' }}</span>
            </div>
        </div>
    </header>

    <!-- Container Centralizado -->
    <main class="container-xl px-3 pb-5 mx-auto" style="max-width: 1100px;">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
