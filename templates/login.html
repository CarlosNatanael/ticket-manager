<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Entrar · RA Monitor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="d-flex align-items-center justify-content-center px-3" style="min-height: 100vh;">
        <div class="modern-card p-4 w-100" style="max-width: 360px;">
            <div class="d-flex align-items-center gap-2 mb-4">
                <div class="brand-icon"><i class="bi bi-ticket-perforated-fill"></i></div>
                <span class="fw-bold text-light" style="font-size: 0.95rem;">RA QA</span>
            </div>

            {% if erro %}
            <div class="alert alert-danger py-2 px-3" style="font-size: 0.8rem;" role="alert">{{ erro }}</div>
            {% endif %}

            <form method="POST" class="m-0">
                <label for="senha" class="form-label text-muted mb-1" style="font-size: 0.7rem;">Senha</label>
                <input type="password" id="senha" name="senha"
                       class="form-control modern-input mb-3"
                       autocomplete="current-password" autofocus required>
                <button type="submit" class="btn btn-gradient w-100 py-2" style="font-size: 0.85rem;">
                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                </button>
            </form>
        </div>
    </main>
</body>
</html>
